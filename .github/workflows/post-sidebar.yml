name: Post Sidebar Links

on:
  schedule:
    - cron: '11 11 * * *'
    - cron: '12 12 * * *'
    - cron: '14 14 * * *'
    - cron: '18 18 * * *'
  workflow_dispatch:
    inputs:
      DRY_RUN:
        description: 'Preview posts without actually posting to Stacker News'
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Restore posted URLs cache
        uses: actions/cache@v4
        with:
          path: posted-urls.json
          key: posted-urls-v1
          save-always: true

      - name: Random delay (0-11 min) for posting window
        if: ${{ !inputs.DRY_RUN }}
        run: sleep $(( RANDOM % 660 ))

      - name: Post one sidebar link to Stacker News
        run: node src/index.js
        env:
          NOSTR_SECRET: ${{ secrets.NOSTR_SECRET }}
          DRY_RUN: ${{ inputs.DRY_RUN || '' }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
