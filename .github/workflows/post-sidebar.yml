name: Post Sidebar Links

on:
  schedule:
    - cron: '11 11 * * *'
    - cron: '14 14 * * *'
  workflow_dispatch:
    inputs:
      DRY_RUN:
        description: 'Preview posts without actually posting to Stacker News'
        type: boolean
        default: false
      SKIP_DELAY:
        description: 'Skip the random 0-11 min delay'
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Restore posted URLs cache
        uses: actions/cache/restore@v4
        with:
          path: posted-urls.json
          key: posted-urls-${{ github.run_id }}
          restore-keys: posted-urls-

      - name: Random delay (0-66 sec) for posting window
        if: ${{ !inputs.DRY_RUN && !inputs.SKIP_DELAY }}
        run: sleep $(( RANDOM % 66 ))

      - name: Post one sidebar link to Stacker News
        run: node src/index.js
        env:
          NOSTR_SECRET: ${{ secrets.NOSTR_SECRET }}
          DRY_RUN: ${{ inputs.DRY_RUN || '' }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}

      - name: Save posted URLs cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: posted-urls.json
          key: posted-urls-${{ github.run_id }}
