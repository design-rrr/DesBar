name: Post Sidebar Links

on:
  schedule:
    - cron: '10 1 * * 0-6'
    - cron: '32 1 * * 0-6'
    - cron: '44 1 * * 0-6'
    - cron: '6 2 * * 0-6'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Random delay (0-11 min) for posting window
        run: sleep $(( RANDOM % 660 ))

      - name: Post one sidebar link to Stacker News
        run: node src/index.js
        env:
          NOSTR_SECRET: ${{ secrets.NOSTR_SECRET }}
