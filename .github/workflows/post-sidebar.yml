name: Post Sidebar Links

on:
  schedule:
    - cron: '0 1 * * 0-6'
    - cron: '0 2 * * 0-6'
    - cron: '0 3 * * 0-6'
    - cron: '0 4 * * 0-6'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Post sidebar links to Stacker News
        run: node src/index.js
        env:
          NOSTR_SECRET: ${{ secrets.NOSTR_SECRET }}
