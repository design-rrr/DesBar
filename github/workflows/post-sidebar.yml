name: Post Sidebar Links

on:
  schedule:
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Generate random delay (0-120 min)
        run: |
          DELAY=$(( RANDOM % 7200 ))
          echo "Waiting $DELAY seconds ($(( DELAY / 60 )) min) for random posting window..."
          sleep $DELAY

      - name: Post sidebar links to Stacker News
        run: node src/index.js
        env:
          NOSTR_SECRET: ${{ secrets.NOSTR_SECRET }}
